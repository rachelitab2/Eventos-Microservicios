     <main class="events-page">
    <!-- Hero Section caribeño -->
    <section class="events-hero">
      <div class="container">
        <h1>Eventos en Punta Cana</h1>
        <p>Descubre las mejores experiencias y actividades que nuestra paraíso caribeño tiene para ofrecer</p>
      </div>
    </section>

    <div class="container">
      
      <!-- Este es el diseño de los filtros en píldora bicolor (Turquesa/Naranja) de la imagen 3 -->
      <div class="filters-container-v3">
        <div class="filters-pill-v3">
          <!-- Dropdown de Categoría -->
          <div class="custom-dropdown" id="categoryDropdown">
            <button class="dropdown-button" type="button">
              <span class="dropdown-text">Category</span>
              <svg class="dropdown-arrow" viewBox="0 0 24 24">
                <path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2" fill="none"/>
              </svg>
            </button>
            <div class="dropdown-menu">
              <div class="dropdown-item active" data-value="">Category</div>
              <div class="dropdown-item" data-value="Aventura">Aventura</div>
              <div class="dropdown-item" data-value="Gastronomía">Gastronomía</div>
              <div class="dropdown-item" data-value="Música">Música</div>
            </div>
          </div>

          <!-- Dropdown de Fecha -->
          <div class="custom-dropdown" id="dateDropdown">
            <button class="dropdown-button" type="button">
              <span class="dropdown-text">Date</span>
              <svg class="dropdown-arrow" viewBox="0 0 24 24">
                <path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="2" fill="none"/>
              </svg>
            </button>
            <div class="dropdown-menu">
              <div class="dropdown-item active" data-value="">Date</div>
              <div class="dropdown-item" data-value="hoy">Hoy</div>
              <div class="dropdown-item" data-value="manana">Mañana</div>
              <div class="dropdown-item" data-value="finsemana">Este fin de semana</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Aquí es donde app.js inyectará las nuevas tarjetas -->
      <div class="events-grid-v3" id="eventsGrid"></div>
      <p class="events-message" id="eventsMessage">Cargando eventos...</p>

    </div>
  </main>



  <script src="app.js?v=2"></script>
