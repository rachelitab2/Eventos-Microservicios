<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pura Vida PC | Detalle del Evento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: var(--color-light); overflow-x: hidden;">
  
  <header class="site-header site-header-solid">
    <div class="container">
      <div class="site-nav nav-shell">
        <a href="index.html" class="brand">
          <span class="brand-mark">
       <svg viewBox="0 0 70 70" aria-hidden="true">
              <circle cx="35" cy="35" r="33" fill="#4B9DA9"></circle>
              <circle cx="35" cy="35" r="30" fill="none" stroke="#91C6BC" stroke-width="0.8" opacity="0.5"></circle>

              <g transform="translate(35, 35)">
                <ellipse cx="0" cy="-15" rx="8" ry="14" fill="#E37434" opacity="0.95" transform="rotate(0)"></ellipse>
                <ellipse cx="0" cy="-15" rx="8" ry="14" fill="#E37434" opacity="0.9" transform="rotate(72)"></ellipse>
                <ellipse cx="0" cy="-15" rx="8" ry="14" fill="#E37434" opacity="0.9" transform="rotate(144)"></ellipse>
                <ellipse cx="0" cy="-15" rx="8" ry="14" fill="#E37434" opacity="0.9" transform="rotate(216)"></ellipse>
                <ellipse cx="0" cy="-15" rx="8" ry="14" fill="#E37434" opacity="0.9" transform="rotate(288)"></ellipse>

                <ellipse cx="0" cy="-12" rx="5" ry="10" fill="#F6F3C2" opacity="0.35" transform="rotate(36)"></ellipse>
                <ellipse cx="0" cy="-12" rx="5" ry="10" fill="#F6F3C2" opacity="0.35" transform="rotate(108)"></ellipse>
                <ellipse cx="0" cy="-12" rx="5" ry="10" fill="#F6F3C2" opacity="0.35" transform="rotate(180)"></ellipse>
                <ellipse cx="0" cy="-12" rx="5" ry="10" fill="#F6F3C2" opacity="0.35" transform="rotate(252)"></ellipse>
                <ellipse cx="0" cy="-12" rx="5" ry="10" fill="#F6F3C2" opacity="0.35" transform="rotate(324)"></ellipse>

                <circle cx="0" cy="0" r="7" fill="#F6F3C2"></circle>
                <circle cx="0" cy="0" r="5" fill="#E37434"></circle>
                <circle cx="0" cy="0" r="2.5" fill="#4B9DA9"></circle>
              </g>
            </svg>
          </span>
          <span class="brand-text">
            <strong>Pura Vida</strong>
            <small>Punta Cana</small>
          </span>
        </a>

        <nav class="nav-links">
          <a href="index.html">Inicio</a>
          <a href="events.html">Eventos</a>
          <a href="my-events.html">Mis Eventos</a>
        </nav>

        <div class="nav-actions" id="userNavActions">
          <a href="auth.html" class="nav-login">Iniciar sesion</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Decoraciones Fondo Palmeras (Simulado en CSS) -->
  <div class="bg-palms-overlay"></div>

  <main class="detail-split-page container" style="padding-top: 130px; padding-bottom: 60px;">
    
    <!-- Lado Izquierdo: Imagen Grande Redondeada -->
    <div class="detail-image-panel">
      <!-- Decoración de Borde Turquesa de fondo -->
      <div class="image-accent-border"></div>
      <img src="images/placeholder_event.jpg" alt="Evento" id="detailImage" class="detail-hero-img">
    </div>

    <!-- Lado Derecho: Tarjetas de Información Flotante -->
    <div class="detail-info-panel">
      
      <!-- Tarjeta 1: Detalles del Evento -->
      <div class="detail-floating-card">
        <div class="floral-icon">
          <!-- Icono tipo flor simplificado del diseño -->
          <svg viewBox="0 0 40 40" width="40" height="40">
            <path d="M20,0 C25,10 35,15 40,20 C35,25 25,30 20,40 C15,30 5,25 0,20 C5,15 15,10 20,0 Z" fill="#4B9DA9" />
            <circle cx="20" cy="20" r="4" fill="#E37434" />
          </svg>
        </div>
        
        <h1 id="detailTitle" class="detail-title-v3">Cargando Título...</h1>
        
        <div class="detail-specs-v3">
          <p><strong>Fecha:</strong> <span id="detailDate">Calculando...</span></p>
          <p><strong>Lugar:</strong> <span id="detailLocation">Calculando...</span></p>
          <p><strong>Cupos:</strong> <span id="detailCapacity">--</span> disponibles</p>
          <p><strong>Precio:</strong> RD$ 0</p>
        </div>

        <button id="inscribirBtn" class="v3-btn final-orange-btn">
          Inscribirme
          <span class="btn-ripple-effect"></span>
        </button>
        <p id="inscriptionMsg" style="text-align: center; margin-top: 15px; font-weight: 500; color: var(--color-primary);"></p>
      </div>

      <!-- Tarjeta 2: Mapa y Ubicación -->
      <div class="detail-floating-card detail-map-card">
        <h2 class="map-title">Información del Lugar</h2>
        
        <div class="map-box">
          <div class="map-pin">
            <svg viewBox="0 0 24 24" width="30" height="30">
              <path d="M12,2 C7.58,2 4,5.58 4,10 C4,15.22 11.27,21.57 11.66,21.91 C11.85,22.08 12.15,22.08 12.34,21.91 C12.73,21.57 20,15.22 20,10 C20,5.58 16.42,2 12,2 Z M12,13 C10.34,13 9,11.66 9,10 C9,8.34 10.34,7 12,7 C13.66,7 15,8.34 15,10 C15,11.66 13.66,13 12,13 Z" fill="#E94A7E" />
            </svg>
          </div>
          <p id="mapLocationText" class="map-address-text">Cargando lugar...</p>
        </div>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
