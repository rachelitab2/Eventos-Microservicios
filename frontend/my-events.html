      <!-- Grid de eventos inscritos -->
      <div id="myEventsGrid" style="display:none; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;"></div>

      <!-- Mensaje cuando no hay eventos o hay error -->
      <div id="myEventsMessage" style="text-align:center; padding:30px; color:#888;"></div>
