  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: var(--color-cream); overflow-x: hidden;">

  <header class="site-header site-header-solid">
    <div class="container">
      <div class="site-nav nav-shell">

        <a href="index.html" class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 70 70" aria-hidden="true">
              <circle cx="35" cy="35" r="33" fill="#4B9DA9"></circle>
              <circle cx="35" cy="35" r="30" fill="none" stroke="#91C6BC" stroke-width="0.8" opacity="0.5"></circle>
              <g transform="translate(35, 35)">
                <ellipse cx="0" cy="-15" rx="8" ry="14" fill="#E37434" opacity="0.95" transform="rotate(0)"></ellipse>
                <ellipse cx="0" cy="-15" rx="8" ry="14" fill="#E37434" opacity="0.9" transform="rotate(72)"></ellipse>
                <ellipse cx="0" cy="-15" rx="8" ry="14" fill="#E37434" opacity="0.9" transform="rotate(144)"></ellipse>
                <ellipse cx="0" cy="-15" rx="8" ry="14" fill="#E37434" opacity="0.9" transform="rotate(216)"></ellipse>
                <ellipse cx="0" cy="-15" rx="8" ry="14" fill="#E37434" opacity="0.9" transform="rotate(288)"></ellipse>
                <ellipse cx="0" cy="-12" rx="5" ry="10" fill="#F6F3C2" opacity="0.35" transform="rotate(36)"></ellipse>
                <ellipse cx="0" cy="-12" rx="5" ry="10" fill="#F6F3C2" opacity="0.35" transform="rotate(108)"></ellipse>
                <ellipse cx="0" cy="-12" rx="5" ry="10" fill="#F6F3C2" opacity="0.35" transform="rotate(180)"></ellipse>
                <ellipse cx="0" cy="-12" rx="5" ry="10" fill="#F6F3C2" opacity="0.35" transform="rotate(252)"></ellipse>
                <ellipse cx="0" cy="-12" rx="5" ry="10" fill="#F6F3C2" opacity="0.35" transform="rotate(324)"></ellipse>
                <circle cx="0" cy="0" r="7" fill="#F6F3C2"></circle>
                <circle cx="0" cy="0" r="5" fill="#E37434"></circle>
                <circle cx="0" cy="0" r="2.5" fill="#4B9DA9"></circle>
              </g>
            </svg>
          </span>
          <span class="brand-text">
            <strong>Pura Vida</strong>
            <small>Punta Cana</small>
          </span>
        </a>

        <nav class="nav-links">
          <a href="index.html">Inicio</a>
          <a href="events.html">Eventos</a>
          <a href="my-events.html">Mis Eventos</a>
        </nav>

        <div class="nav-actions" id="userNavActions"></div>

      </div>
    </div>
  </header>

  <main class="profile-page-container">
    <div class="profile-card my-events-shell" style="max-width: 1080px;">
      <div class="profile-palms-bg"></div>

      <div class="profile-avatar">
        <div class="palm-icon-circle">
          <svg viewBox="0 0 64 64" width="50" height="50">
            <path d="M30,60 L34,60 C34,60 38,30 32,20 C32,20 28,30 30,60 Z" fill="#3B261D"/>
            <path d="M32,20 C20,10 5,25 5,25 C5,25 20,15 32,20 Z" fill="#3B261D"/>
            <path d="M32,20 C45,10 60,25 60,25 C60,25 45,15 32,20 Z" fill="#3B261D"/>
            <path d="M32,20 C25,5 15,5 15,5 C15,5 25,10 32,20 Z" fill="#3B261D"/>
            <path d="M32,20 C40,5 50,5 50,5 C50,5 40,10 32,20 Z" fill="#3B261D"/>
          </svg>
        </div>
      </div>

      <div class="my-events-header">
        <span class="my-events-kicker">Panel personal</span>
        <h2>Mis Eventos</h2>
        <p>Aqu&iacute; puedes ver todos los eventos en los que te has inscrito y revisar su estado en tiempo real.</p>
      </div>

      <div id="myEventsFilters" class="my-events-filters" style="display:none;">
        <button class="my-filter-pill active" onclick="filtrarMisEventos('ALL', this)">
          Todos <span id="cntAll">0</span>
        </button>
        <button class="my-filter-pill" onclick="filtrarMisEventos('CONFIRMED', this)">
          Confirmados <span id="cntConfirmed">0</span>
        </button>
        <button class="my-filter-pill" onclick="filtrarMisEventos('PENDING', this)">
          Pendientes <span id="cntPending">0</span>
        </button>
        <button class="my-filter-pill" onclick="filtrarMisEventos('CANCELLED', this)">
          Cancelados <span id="cntCancelled">0</span>
        </button>
      </div>

      <div id="myEventsGrid" class="events-grid-v3" style="display:none;"></div>
      <div id="myEventsMessage" class="my-events-message" style="text-align:center; padding:30px; color:#888;"></div>
    </div>
  </main>

  <div class="star-decoration">
    <svg viewBox="0 0 24 24" width="40" height="40">
      <path d="M12,0 C12,12 24,12 24,12 C24,12 12,12 12,24 C12,12 0,12 0,12 C0,12 12,12 12,0 Z" fill="#F6F3C2" opacity="0.8"/>
    </svg>
  </div>

  <script src="app.js"></script>
</body>
</html>
