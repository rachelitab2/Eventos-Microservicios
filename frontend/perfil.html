                <ellipse cx="0" cy="-12" rx="5" ry="10" fill="#F6F3C2" opacity="0.35" transform="rotate(252)"></ellipse>

                <circle cx="0" cy="0" r="7" fill="#F6F3C2"></circle>

       <div class="nav-actions" id="userNavActions">

</div>
            <!-- La barra ahora en su versión minimalista arriba derecha (CarlosR | Cerrar Sesión) -->
        </div>
      </div>
    </div>
  </header>

  <!-- Container for Profile Page Matching Design -->
  <main class="profile-page-container">
    
    <div class="profile-card">
      <!-- Decoración de Palmeras de Fondo para la Tarjeta -->
      <div class="profile-palms-bg"></div>

      <!-- Icono Central de Palmera -->
      <div class="profile-avatar">
        <div class="palm-icon-circle">
          <svg viewBox="0 0 64 64" width="50" height="50">
            <!-- Palmera simplificada -->
            <path d="M30,60 L34,60 C34,60 38,30 32,20 C32,20 28,30 30,60 Z" fill="#3B261D"/>
            <path d="M32,20 C20,10 5,25 5,25 C5,25 20,15 32,20 Z" fill="#3B261D"/>
            <path d="M32,20 C45,10 60,25 60,25 C60,25 45,15 32,20 Z" fill="#3B261D"/>
            <path d="M32,20 C25,5 15,5 15,5 C15,5 25,10 32,20 Z" fill="#3B261D"/>
            <path d="M32,20 C40,5 50,5 50,5 C50,5 40,10 32,20 Z" fill="#3B261D"/>
          </svg>
        </div>
      </div>

      <!-- Formulario de Perfil -->
      <form class="profile-form" id="profileForm">
        
        <div class="form-row">
          <div class="form-group">
            <label>nombre</label>
            <input type="text" id="profName" placeholder="nombre" class="focused-input">
          </div>
          <div class="form-group">
            <label>apellido</label>
            <input type="text" id="profLastName" placeholder="apellido">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label>teléfono</label>
            <input type="text" id="profPhone" placeholder="teléfono">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label>dirección</label>
            <input type="text" id="profAddress" placeholder="dirección">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>género</label>
            <select id="profGender">
              <option value="Female">Female</option>
              <option value="Male">Male</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>fecha de nacimiento</label>
            <input type="text" id="profDob" placeholder="07/11/2021">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label>foto perfil URL</label>
            <input type="text" id="profAvatarUrl" placeholder="foto perfil URL">
          </div>
        </div>

        <div class="submit-row">
          <button type="submit" class="profile-submit-btn">Guardar Cambios</button>
          <button type="button" class="profile-logout-btn" id="logoutBtn">Cerrar Sesión</button>
        </div>

      </form>
    </div>
    
  </main>

  <!-- Pequeña estrellita decorativa en la esquina inferior derecha -->
  <div class="star-decoration">
    <svg viewBox="0 0 24 24" width="40" height="40">
      <path d="M12,0 C12,12 24,12 24,12 C24,12 12,12 12,24 C12,12 0,12 0,12 C0,12 12,12 12,0 Z" fill="#F6F3C2" opacity="0.8"/>
    </svg>
  </div>

  <script src="app.js"></script>
</body>
</html>
