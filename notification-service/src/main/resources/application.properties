spring.application.name=notification-service
server.port=${PORT:8085}

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/notification_db}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root123}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

app.mail.provider=${MAIL_PROVIDER:gmail-api}
app.mail.from-email=${MAIL_FROM_EMAIL:lemonresort2025@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Pura Vida PC}
app.frontend-url=${APP_FRONTEND_URL:https://frontend-production-5e8b.up.railway.app}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:${MAIL_USERNAME:lemonresort2025@gmail.com}}
spring.mail.password=${SMTP_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_TIMEOUT:5000}

sendgrid.api-key=${SENDGRID_API_KEY:}
